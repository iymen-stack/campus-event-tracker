<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Campus Event Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Campus Event Tracker</h1>
    </header>

    <main class="login-container">

        <section class="login-card">

            <h2>Login</h2>

            <p role="status">
                Login is not available yet.
                This page is a prototype. Please do not enter your Augsburg credentials.
            </p>

            <div class="login-prototype">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Augsburg email" disabled>

                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Password" disabled>

                <button type="button" disabled>Login unavailable</button>
            </div>

        </section>

    </main>

</body>

</html>

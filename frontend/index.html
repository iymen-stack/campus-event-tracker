<!DOCTYPE html>
<html lang='en'>

<head>
    <meta charset="UTF-8">
    <!-- Makes the page use the actual device width so the layout responds correctly on phones -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Event Tracker</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Introduces the page and tells the user what site they are on -->
    <header>
        <h1>Campus Event Tracker</h1>
    </header>

    <!-- Keeps the page's primary content separate from the site header -->
    <main>
        <!-- Groups all of the campus events under one Events heading -->
        <section>
            <h2>EVENTS</h2>

            <div class="event-filters" aria-label="Search and filter events">
                <label>
                    Search by title
                    <input id="title-search" type="search" placeholder="Search event titles">
                </label>
                <label>
                    Category
                    <select id="category-filter">
                        <option value="">All categories</option>
                    </select>
                </label>
                <label>
                    Location
                    <input id="location-filter" type="search" placeholder="Search locations">
                </label>
                <label>
                    Date
                    <input id="date-filter" type="date">
                </label>
                <label>
                    Quick date filter
                    <select id="date-range-filter">
                        <option value="">Any date</option>
                        <option value="today">Today</option>
                        <option value="week">This week</option>
                    </select>
                </label>
            </div>

            <!-- Groups the event cards so they can all share the same layout and spacing -->
            <div class="event-list"></div>
            <p class="event-status" role="status" aria-live="polite">Loading events...</p>
        </section>

    </main>

    <script>
        const eventList = document.querySelector(".event-list");
        const eventStatus = document.querySelector(".event-status");
        const titleSearch = document.querySelector("#title-search");
        const categoryFilter = document.querySelector("#category-filter");
        const locationFilter = document.querySelector("#location-filter");
        const dateFilter = document.querySelector("#date-filter");
        const dateRangeFilter = document.querySelector("#date-range-filter");
        let allEvents = [];

        function parseDate(value) {
            if (!value) {
                return null;
            }

            const date = new Date(typeof value === "string" ? value.replace(" ", "T") : value);
            return Number.isNaN(date.getTime()) ? null : date;
        }

        function localDateKey(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, "0");
            const day = String(date.getDate()).padStart(2, "0");
            return `${year}-${month}-${day}`;
        }

        function matchesDate(event) {
            const start = parseDate(event.start_time);
            const end = parseDate(event.end_time) || start;
            const selectedDate = dateFilter.value;

            if (selectedDate && (!start || localDateKey(start) !== selectedDate)) {
                return false;
            }

            if (!dateRangeFilter.value) {
                return true;
            }

            const now = new Date();
            const rangeStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const rangeEnd = new Date(rangeStart);

            if (dateRangeFilter.value === "week") {
                rangeStart.setDate(rangeStart.getDate() - ((rangeStart.getDay() + 6) % 7));
                rangeEnd.setTime(rangeStart.getTime());
                rangeEnd.setDate(rangeStart.getDate() + 7);
            } else {
                rangeEnd.setDate(rangeEnd.getDate() + 1);
            }

            return Boolean(start && end && start < rangeEnd && end >= rangeStart);
        }

        function renderEvents() {
            const titleQuery = titleSearch.value.trim().toLocaleLowerCase();
            const locationQuery = locationFilter.value.trim().toLocaleLowerCase();
            const category = categoryFilter.value;

            const matchingEvents = allEvents.filter((event) =>
                (event.title || "").toLocaleLowerCase().includes(titleQuery)
                && (!category || event.category === category)
                && (event.location_name || "").toLocaleLowerCase().includes(locationQuery)
                && matchesDate(event)
            );

            eventList.replaceChildren(...matchingEvents.map(createEventCard));
            if (allEvents.length === 0) {
                eventStatus.textContent = "No events found.";
            } else if (matchingEvents.length === 0) {
                eventStatus.textContent = "No events match your search and filters.";
            } else {
                eventStatus.textContent = "";
            }
        }

        [titleSearch, categoryFilter, locationFilter, dateFilter, dateRangeFilter]
            .forEach((filter) => filter.addEventListener("input", renderEvents));
        categoryFilter.addEventListener("change", renderEvents);
        dateRangeFilter.addEventListener("change", renderEvents);

        function formatDateTime(value) {
            const date = parseDate(value);
            if (!date) {
                return "Time unavailable";
            }

            return date.toLocaleString(undefined, {
                dateStyle: "medium",
                timeStyle: "short"
            });
        }

        function createEventCard(event) {
            const card = document.createElement("article");
            card.className = "event-card";

            const title = document.createElement("h3");
            title.textContent = event.title || "Untitled event";

            const dateTime = document.createElement("p");
            dateTime.textContent = `${formatDateTime(event.start_time)} - ${formatDateTime(event.end_time)}`;

            const location = document.createElement("p");
            location.textContent = event.location_name || "Location unavailable";

            card.append(title, dateTime, location);
            return card;
        }

        async function loadEvents() {
            try {
                const response = await fetch("/api/events");
                if (!response.ok) {
                    throw new Error(`Request failed with status ${response.status}`);
                }

                const responseEvents = await response.json();
                if (!Array.isArray(responseEvents)) {
                    throw new Error("The events response was not a list");
                }

                allEvents = responseEvents;
                const categories = [...new Set(allEvents.map((event) => event.category).filter(Boolean))]
                    .sort((a, b) => a.localeCompare(b));
                categories.forEach((category) => {
                    const option = document.createElement("option");
                    option.value = category;
                    option.textContent = category;
                    categoryFilter.append(option);
                });
                renderEvents();
            } catch (error) {
                console.error("Unable to load events:", error);
                const reason = error instanceof Error ? error.message : String(error);
                eventStatus.textContent = `Unable to load events: ${reason}. Make sure /api/events is available from this server.`;
            }
        }

        loadEvents();
    </script>
</body>

</html>
